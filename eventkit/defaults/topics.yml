# Topics for grouping the public's chat questions.
# Each question goes to the topic whose keywords it matches most (accent- and case-insensitive,
# whole words or phrases). Edit freely; a copy in the data folder's config/topics.yml wins.
# "logistica" is special: questions about materials, links, dates or registration.

logistica:
  label: "Logística (materiales, enlaces, fechas)"
  keywords: [enlace, link, links, material, materiales, grabacion, presentacion disponible, diapositivas, ppt,
             portal, donde puedo, donde se van, acceder, descargar, registro, inscripcion, inscribirse,
             fecha, horario, que dia, 3 de noviembre, certificado, constancia, contenidos]

topics:
  - label: "Coordinación e integración regional"
    keywords: [regional, region, regiones, integracion, integracion regional, coordinacion, coordinar, articulacion,
               articular, intraregional, intrarregional, cooperacion, bloque, america latina, centroamerica, minilateral]
  - label: "Comercio, reglas de origen y T-MEC"
    keywords: [reglas de origen, regla de origen, t-mec, tmec, usmca, tlcan, arancel, aranceles, comercio, comercial,
               nearshoring, exportaciones, exportacion, importaciones, vcr, contenido regional, proteccionismo, hubs]
  - label: "Empresas, pymes y proveedores"
    keywords: [pyme, pymes, mipyme, mipymes, mype, myp, proveedores, proveeduria, empresas, empresa, encadenamiento,
               multinacionales, mnc, maquila, ensamblaje, ensamblado, spin-offs, startups, emprendimientos, productores]
  - label: "Tecnología, innovación y capacidades"
    keywords: [tecnologia, tecnologica, tecnologico, transferencia, innovacion, capacidades, cti, conocimiento,
