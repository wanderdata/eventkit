# Topics for grouping the public's chat questions.
# Each question goes to the topic whose keywords it matches most (accent- and case-insensitive,
# whole words or phrases; Spanish and English). Edit freely; a copy in the data folder's config/topics.yml wins.
# "logistica" is special: questions about materials, links, dates or registration.

logistica:
  label: "Logística (materiales, enlaces, fechas)"
  keywords: [enlace, link, links, material, materiales, grabacion, recording, presentacion disponible, diapositivas,
             slides, ppt, portal, donde puedo, donde se van, acceder, descargar, download, registro, inscripcion,
             inscribirse, register, fecha, horario, que dia, certificado, certificate, constancia, contenidos]

