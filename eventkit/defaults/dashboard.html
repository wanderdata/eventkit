<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablero de webinars</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6f6d68;
  --grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--accent:#2a78d6;--warnbg:#fff6e0;--warnink:#6b4a00;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#9a988f;
  --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--accent:#3987e5;
  --warnbg:#2b2310;--warnink:#f2d48a;}}
:root[data-theme="dark"]{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#9a988f;
  --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--accent:#3987e5;--warnbg:#2b2310;--warnink:#f2d48a;}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
header{padding:20px 16px 0;max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:14px;margin-top:2px}
.lang button,.tabs button{font:inherit;border:1px solid var(--ring);background:var(--surface);color:var(--ink2);padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"],.tabs button[aria-selected="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.tabs{max-width:1200px;margin:16px auto 0;padding:0 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin}
.tabs button{white-space:nowrap}
main{max-width:1200px;margin:0 auto;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:12px 14px}
.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.02em}
.kpi .l{color:var(--ink2);font-size:13px}
.kpi .n{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px;min-width:0}
.card h2{font-size:15px;margin:0 0 2px;font-weight:620}
.card .hint{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg{display:block;width:100%;overflow:visible}
svg text{fill:var(--muted);font-size:11.5px}
svg .lbl{fill:var(--ink2)}
svg .val{fill:var(--ink);font-weight:600}
.ringwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ringwrap svg{width:180px;flex:0 0 180px}
.ringleg{flex:1 1 200px;min-width:0;display:grid;gap:6px;font-size:13px}
.ringleg .r{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;cursor:default}
.ringleg i{width:12px;height:12px;border-radius:3px}
.ringleg .p{font-weight:650;color:var(--ink)}
.ringleg .c{color:var(--muted);font-size:12px;min-width:56px;text-align:right}
.ringleg .r.dim{opacity:.45}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--page);padding:6px 9px;border-radius:8px;font-size:12.5px;line-height:1.35;opacity:0;transition:opacity .08s;z-index:10;max-width:260px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{color:var(--ink2);font-weight:600;font-size:12.5px}
td.t{white-space:normal;min-width:160px}
th.l,td.l{text-align:left!important}
td a{color:var(--accent);text-decoration:none}td a:hover{text-decoration:underline}
.scroll{overflow-x:auto}
.ev-head{margin:0 0 14px}
.ev-head h2{font-size:20px;margin:0}
.ev-head .meta{color:var(--ink2)}
.article{max-width:720px}
.article h1{font-size:20px;line-height:1.3;margin:0 0 10px}
.article p{margin:0 0 12px}
.article a{color:var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.btn{display:inline-block;border:1px solid var(--ring);border-radius:8px;padding:6px 12px;color:var(--ink);text-decoration:none;background:var(--page);font-size:13.5px;cursor:pointer}
.note{background:var(--warnbg);color:var(--warnink);border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 16px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--ink2);font-size:13.5px}
.review{font-size:13px;white-space:pre-wrap;color:var(--ink2);background:var(--page);padding:10px;border-radius:8px}
.empty{color:var(--muted);font-size:13px}
.pbtn{font:inherit;font-size:13.5px;border:1px solid var(--ring);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
.kpi .d{font-size:12px;color:var(--ink2);margin-top:2px}
.kgroup{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 8px}
.facts{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.facts h2{font-size:15px;margin:0 0 6px}
.facts ul{margin:0;padding-left:18px}
.facts li{margin:3px 0}
@media (max-width:520px){.kpi .v{font-size:22px}h1{font-size:19px}}
.embed header,.embed .tabs,.embed .btns,.embed .article-card{display:none!important}
.embed main{padding-top:4px}
.embed .view-head h2{display:none}
@media print{
  body{background:#fff}
  .tabs,.pbtn,.btns,details,.article{display:none!important}
  .card,.kpi,.facts{break-inside:avoid;border-color:#ccc}
  main{padding:0}
}
</style>
</head>
<body>
<header>
  <div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div>
  <button class="pbtn" id="print" type="button">Imprimir / guardar PDF</button>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main id="main"></main>
<div class="tip" id="tip" role="tooltip"></div>
<script>
const DATA = /*__DATA__*/null;
DATA.series_list=DATA.series_list||[];DATA.series_metrics=DATA.series_metrics||{};DATA.global=DATA.global||{};DATA.events=DATA.events||[];
const T = {
 es:{series:"Toda la serie",events:"Sesiones",unique:"Personas únicas",uniqueN:"asistentes distintos en la serie",regs:"Inscripciones",conv:"Tasa de asistencia",convN:"inscritos que se conectaron",twoplus:"Asistieron a 2+ sesiones",women:"Mujeres",lac:"América Latina y el Caribe",participants:"Participantes",participantsN:"conexiones únicas, incl. organización",attendees:"Público",peak:"Pico simultáneo",median:"Minutos conectados (mediana)",stayed:"Se quedaron más de la mitad",countries:"Países",questions:"Preguntas en el chat",regVsPart:"Inscritos y participantes por sesión",regVsPartH:"Personas únicas por sesión",newRet:"Público nuevo y recurrente",newRetH:"Recurrente = asistió a una sesión anterior de la serie",new:"Nuevo",ret:"Recurrente",tableT:"Resumen por sesión",date:"Fecha",session:"Sesión",speaker:"Ponente",over:"Personas conectadas durante la sesión",overH:"Público (sin organización ni panel), cada 2 minutos",byCountry:"Participantes por país",byCountryH:"Según el formulario de inscripción; % sobre participantes con país conocido",bySector:"Participantes por sector",bySectorH:"Clasificado a partir de la organización y el correo de cada persona",byGender:"Participantes por género",funnel:"Inscritos y asistentes por país",funnelH:"Los 12 países con más inscripciones",registered:"Inscritos",attended:"Asistieron",summary:"Nota informativa",download:"Descargar Word",review:"Revisión automática (citas y nombres)",noSummary:"Aún no hay nota para esta sesión.",F:"Mujeres",M:"Hombres",O:"Otro / prefiere no decir",others:"Otros",usNote:n=>`Se descartaron ${n} respuestas «Estados Unidos» que Webex preselecciona en el formulario (país desconocido salvo que el correo indique otro país).`,inferredNote:n=>`País inferido desde el dominio del correo para ${n} personas.`,of:"de",min:"min",people:"personas"}
};
const lang = "es";
const EMBED = !!window.EK_EMBED;
let tab = window.EK_TAB || decodeURIComponent(location.hash.slice(1)) || "global";
const $ = (s,el=document)=>el.querySelector(s);
const h = (tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else e.setAttribute(k,v)}for(const k of kids)if(k!=null)e.append(k);return e};
const NS="http://www.w3.org/2000/svg";
const s = (tag,attrs={})=>{const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e};
const fmt = (v,d=0)=>v==null?"–":Number(v).toLocaleString(lang==="es"?"es-CL":"en-GB",{maximumFractionDigits:d,minimumFractionDigits:d});
const pct = v=>v==null?"–":fmt(v,0)+"%";
const t = k=>T[lang][k];
const evTitle = e=>(lang==="es"?e.title_es:e.title_en)||e.webinar_name;
const dateStr = d=>d?new Date(d+"T12:00:00").toLocaleDateString(lang==="es"?"es-CL":"en-GB",{day:"numeric",month:"short",year:"numeric"}):"";
const cname = k=>lang==="en"?(DATA.country_en[k]||k):k;
const secName = k=>(DATA.sectors[k]||{})[lang]||k;
const tip = $("#tip");
function showTip(ev,lines){tip.replaceChildren(...lines.map((l,i)=>h("div",i===0?{style:"font-weight:600"}:{},l)));tip.style.opacity=1;const x=Math.min(ev.clientX+14,innerWidth-tip.offsetWidth-8);tip.style.left=x+"px";tip.style.top=(ev.clientY+14)+"px"}
function hideTip(){tip.style.opacity=0}

/* ---------- charts ---------- */
function legend(items){return h("div",{class:"legend"},...items.map(([c,l])=>h("span",{},h("i",{style:`background:${c}`}),l)))}
function hbars(rows,{series=[{key:"n",color:"var(--s1)",label:""}],valueFmt=v=>fmt(v),max=null}={}){
  // rows: [{label, n|..., tip:[...]}]; horizontal bars, labels left, values right
  const wrap=h("div");const draw=()=>{
    const W=Math.max(280,wrap.clientWidth||460), lw=Math.min(230,W*.4), vw=58, bh=series.length>1?9:14, gap=series.length>1?2:0, rowH=series.length*bh+(series.length-1)*gap+12;
    const H=rows.length*rowH+4, mx=max||Math.max(1,...rows.flatMap(r=>series.map(sr=>r[sr.key]||0)));
    const svg=s("svg",{viewBox:`0 0 ${W} ${H}`,height:H,role:"img"});
    rows.forEach((r,i)=>{const y=i*rowH+6;
      const lab=s("text",{x:lw-8,y:y+(rowH-12)/2+4,"text-anchor":"end",class:"lbl"});const mc=Math.floor((lw-10)/6.4);lab.textContent=r.label.length>mc?r.label.slice(0,mc-1)+"…":r.label;svg.append(lab);
      series.forEach((sr,j)=>{const v=r[sr.key]||0,w=Math.max(v>0?2:0,(W-lw-vw)*v/mx),yy=y+j*(bh+gap);
        svg.append(s("rect",{x:lw,y:yy,width:w,height:bh,rx:Math.min(4,w/2),fill:sr.color}));
        const vt=s("text",{x:lw+w+6,y:yy+bh/2+4,class:j===0?"val":""});vt.textContent=valueFmt(v,r,sr);svg.append(vt);});
      const hit=s("rect",{x:0,y:i*rowH,width:W,height:rowH,fill:"transparent",tabindex:0});
      const lines=r.tip||[r.label,...series.map(sr=>(sr.label?sr.label+": ":"")+valueFmt(r[sr.key]||0,r,sr))];
      hit.addEventListener("pointermove",e=>showTip(e,lines));hit.addEventListener("pointerleave",hideTip);
      hit.addEventListener("focus",e=>{const b=hit.getBoundingClientRect();showTip({clientX:b.left+lw,clientY:b.top},lines)});hit.addEventListener("blur",hideTip);
      svg.append(hit);});
    wrap.replaceChildren(svg)};
  new ResizeObserver(draw).observe(wrap);return wrap}

function vbars(cats,series,{stacked=false}={}){
  const wrap=h("div");const draw=()=>{
    const hasNote=cats.some(c=>c.note);
    const W=Math.max(280,wrap.clientWidth||460),H=hasNote?250:230,pl=40,pb=hasNote?56:40,pt=18,iw=W-pl-8,ih=H-pb-pt;
    const tot=cats.map((_,i)=>stacked?series.reduce((a,sr)=>a+(sr.values[i]||0),0):Math.max(...series.map(sr=>sr.values[i]||0)));
    const mx=niceMax(Math.max(1,...tot));const svg=s("svg",{viewBox:`0 0 ${W} ${H}`,height:H,role:"img"});
    for(const v of ticks(mx)){const y=pt+ih-ih*v/mx;svg.append(s("line",{x1:pl,x2:W-8,y1:y,y2:y,stroke:v?"var(--grid)":"var(--axis)"}));const tx=s("text",{x:pl-6,y:y+4,"text-anchor":"end"});tx.textContent=fmt(v);svg.append(tx)}
    const bw=iw/cats.length, inner=Math.min(stacked?56:36,(bw*.7)/(stacked?1:series.length));
    cats.forEach((c,i)=>{const cx=pl+bw*i+bw/2;let acc=0;
      series.forEach((sr,j)=>{const v=sr.values[i]||0,hgt=ih*v/mx;let x,y;
        if(stacked){x=cx-inner/2;y=pt+ih-ih*(acc+v)/mx;acc+=v}else{x=cx-(inner*series.length+2*(series.length-1))/2+j*(inner+2);y=pt+ih-hgt}
        svg.append(s("rect",{x,y:y+(stacked&&j?1:0),width:inner,height:Math.max(0,hgt-(stacked&&j?2:0)),rx:3,fill:sr.color}));
        if(!stacked&&v){const vt=s("text",{x:x+inner/2,y:y-5,"text-anchor":"middle",class:"val"});vt.textContent=fmt(v);svg.append(vt)}});
      if(stacked){const vt=s("text",{x:cx,y:pt+ih-ih*acc/mx-5,"text-anchor":"middle",class:"val"});vt.textContent=fmt(acc);svg.append(vt)}
      const lb=s("text",{x:cx,y:H-pb+16,"text-anchor":"middle",class:"lbl"});lb.textContent=c.label;svg.append(lb);
      const lb2=s("text",{x:cx,y:H-pb+30,"text-anchor":"middle"});lb2.textContent=c.sub||"";svg.append(lb2);
      if(c.note){const lb3=s("text",{x:cx,y:H-pb+45,"text-anchor":"middle",class:"lbl",style:"font-weight:600"});lb3.textContent=c.note;svg.append(lb3)}
      const hit=s("rect",{x:pl+bw*i,y:pt,width:bw,height:ih,fill:"transparent"});
      const lines=[c.tipTitle||c.label,...series.filter(sr=>!stacked||sr.values[i]).map(sr=>`${sr.label}: ${fmt(sr.values[i]||0)}`)];
      hit.addEventListener("pointermove",e=>showTip(e,lines));hit.addEventListener("pointerleave",hideTip);svg.append(hit)});
    wrap.replaceChildren(svg)};
  new ResizeObserver(draw).observe(wrap);return wrap}

function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,2,2.5,5,10])if(m*p>=v)return m*p;return v}
function niceMax(v){const st=niceStep(v/4);return Math.ceil(v/st)*st}
function ticks(mx){const st=niceStep(mx/4);const out=[];for(let v=0;v<=mx+1e-9;v+=st)out.push(v);return out}

// ---- attendance over time + chat activity strip + scheduled start marker
function timelineChart(pts,chat){
  const wrap=h("div");const cmap={};(chat||[]).forEach(c=>cmap[c.t]=c.n);
  const draw=()=>{
    const W=Math.max(300,wrap.clientWidth||600),pl=40,pr=12,iw=W-pl-pr,top=14,H1=190,gap=26,H2=chat&&chat.length?44:0,H=top+H1+(H2?gap+H2:0)+24;
    const mx=niceMax(Math.max(1,...pts.map(p=>p.n))),cmx=Math.max(1,...pts.map(p=>cmap[p.t]||0));
    const X=i=>pl+iw*i/Math.max(1,pts.length-1),Y=v=>top+H1-H1*v/mx;
    const svg=s("svg",{viewBox:`0 0 ${W} ${H}`,height:H,role:"img"});
    for(const v of ticks(mx)){const y=Y(v);svg.append(s("line",{x1:pl,x2:W-pr,y1:y,y2:y,stroke:v?"var(--grid)":"var(--axis)"}));const tx=s("text",{x:pl-6,y:y+4,"text-anchor":"end"});tx.textContent=fmt(v);svg.append(tx)}
    const st=pts.findIndex(p=>p.m!=null&&p.m>=0);
    if(st>0){svg.append(s("line",{x1:X(st),x2:X(st),y1:top,y2:top+H1,stroke:"var(--ink2)","stroke-dasharray":"3 3",opacity:.6}));
      const tl=s("text",{x:X(st)+4,y:top+10});tl.textContent="Inicio programado";svg.append(tl)}
    const d=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.n).toFixed(1)}`).join("");
    svg.append(s("path",{d:d+`L${X(pts.length-1)},${Y(0)}L${X(0)},${Y(0)}Z`,fill:"var(--s1)",opacity:.12}));
    svg.append(s("path",{d,fill:"none",stroke:"var(--s1)","stroke-width":2,"stroke-linejoin":"round"}));
    const pk=pts.reduce((a,p,i)=>p.n>pts[a].n?i:a,0);
    svg.append(s("circle",{cx:X(pk),cy:Y(pts[pk].n),r:4,fill:"var(--s1)",stroke:"var(--surface)","stroke-width":2}));
    const pl2=s("text",{x:X(pk),y:Y(pts[pk].n)-9,"text-anchor":"middle",class:"val"});pl2.textContent=`Máximo: ${fmt(pts[pk].n)}`;svg.append(pl2);
    if(H2){const y0=top+H1+gap,bw=Math.max(1.5,iw/pts.length-1.5);
      const cl=s("text",{x:pl,y:y0-6,class:"lbl"});cl.textContent="Mensajes en el chat";svg.append(cl);
      svg.append(s("line",{x1:pl,x2:W-pr,y1:y0+H2,y2:y0+H2,stroke:"var(--axis)"}));
      pts.forEach((p,i)=>{const c=cmap[p.t]||0;if(c){const bh=H2*c/cmx;svg.append(s("rect",{x:X(i)-bw/2,y:y0+H2-bh,width:bw,height:bh,rx:1.5,fill:"var(--s2)"}))}})}
    const step=Math.ceil(pts.length/Math.max(2,Math.floor(iw/70)));
    pts.forEach((p,i)=>{if(i%step===0){const tx=s("text",{x:X(i),y:H-6,"text-anchor":"middle"});tx.textContent=p.t;svg.append(tx)}});
    const cross=s("line",{y1:top,y2:top+H1+(H2?gap+H2:0),stroke:"var(--axis)",opacity:0}),dot=s("circle",{r:4,fill:"var(--s1)",stroke:"var(--surface)","stroke-width":2,opacity:0});svg.append(cross,dot);
    const hit=s("rect",{x:pl,y:top,width:iw,height:H-top-20,fill:"transparent"});
    hit.addEventListener("pointermove",e=>{const b=svg.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width;const i=Math.max(0,Math.min(pts.length-1,Math.round((x-pl)/iw*(pts.length-1))));
      cross.setAttribute("x1",X(i));cross.setAttribute("x2",X(i));cross.setAttribute("opacity",1);dot.setAttribute("cx",X(i));dot.setAttribute("cy",Y(pts[i].n));dot.setAttribute("opacity",1);
      const m=pts[i].m;showTip(e,[`${pts[i].t}${m!=null?` (${m>=0?"+":""}${m} min)`:""}`,`${fmt(pts[i].n)} ${t("people")} conectadas`,...(H2?[`${fmt(cmap[pts[i].t]||0)} mensajes en el chat`]:[])])});
    hit.addEventListener("pointerleave",()=>{hideTip();cross.setAttribute("opacity",0);dot.setAttribute("opacity",0)});svg.append(hit);
    wrap.replaceChildren(svg)};
  new ResizeObserver(draw).observe(wrap);return wrap}

// ---- cumulative registrations by day before the event
function cumLine(rc){
  const wrap=h("div");const pts=rc.points;const draw=()=>{
    const W=Math.max(280,wrap.clientWidth||460),H=210,pl=44,pr=14,pt=16,pb=26,iw=W-pl-pr,ih=H-pt-pb;
    const mx=niceMax(Math.max(1,rc.total)),X=i=>pl+iw*i/Math.max(1,pts.length-1),Y=v=>pt+ih-ih*v/mx;
    const svg=s("svg",{viewBox:`0 0 ${W} ${H}`,height:H,role:"img"});
    for(const v of ticks(mx)){const y=Y(v);svg.append(s("line",{x1:pl,x2:W-pr,y1:y,y2:y,stroke:v?"var(--grid)":"var(--axis)"}));const tx=s("text",{x:pl-6,y:y+4,"text-anchor":"end"});tx.textContent=fmt(v);svg.append(tx)}
    const wk=pts.findIndex(p=>p.d===-7);
    if(wk>=0){svg.append(s("rect",{x:X(wk),y:pt,width:X(pts.length-1)-X(wk),height:ih,fill:"var(--s2)",opacity:.07}));
      const l=s("text",{x:X(wk)+4,y:pt+11});l.textContent="última semana";svg.append(l)}
    const d=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.n).toFixed(1)}`).join("");
    svg.append(s("path",{d,fill:"none",stroke:"var(--s1)","stroke-width":2,"stroke-linejoin":"round"}));

function md(src){
  const esc=x=>x.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const inline=x=>esc(x).replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
  return src.replace(/<!--[\s\S]*?-->\n?/g,"").split(/\n{2,}/).map(b=>b.trim()).filter(Boolean).map(b=>b.startsWith("# ")?`<h1>${inline(b.slice(2))}</h1>`:`<p>${inline(b.replace(/\n/g," "))}</p>`).join("");
}

function table(cols,rows,textCols){
  const L=new Set([].concat(textCols));
  return h("div",{class:"scroll"},h("table",{},h("thead",{},h("tr",{},...cols.map((c,j)=>h("th",L.has(j)?{class:"l",text:c[0]}:{text:c[0]})))),
    h("tbody",{},...rows.map((e,i)=>h("tr",{},...cols.map((c,j)=>{const v=c[1](e,i);const td=h("td",L.has(j)?{class:"t l"}:{});
      if(v instanceof Node)td.append(v);else td.textContent=String(v);return td}))))))}

function globalView(){
  const E=DATA.events,G=DATA.global||{},SL=DATA.series_list;
  if(!E.length)return [h("p",{class:"empty",text:"Todavía no hay eventos."})];
  const regs=E.reduce((a,e)=>a+(e.registrations||0),0),parts=E.reduce((a,e)=>a+(e.participants_total||0),0);
  const conv=E.filter(e=>e.conversion_pct!=null);
  const head=h("div",{class:"ev-head view-head"},h("h2",{text:"Todos los eventos"}),h("div",{class:"meta",text:`${E.length} eventos en ${SL.length} ${SL.length===1?"serie":"series"} · ${dateStr(E[0].date)} – ${dateStr(E[E.length-1].date)}`}));
  const k=h("div",{class:"kpis"},
    kpi(fmt(E.length),"Eventos"),
    kpi(fmt(SL.length),"Series"),
    kpi(fmt(G.unique_attendees),"Personas únicas","asistentes distintos en todos los eventos"),
    kpi(fmt(parts),"Participaciones","suma de participantes de cada evento"),
    kpi(fmt(regs),t("regs")),
    kpi(pct(avg(conv,e=>e.conversion_pct)),t("conv"),"promedio de los eventos"),
    kpi(fmt(G.attended_2plus),"Asistieron a 2+ eventos"),
    kpi(fmt(G.multi_series),"Participaron en 2+ series"),
    kpi(pct(avg(E.filter(e=>e.demographics.women_pct!=null),e=>e.demographics.women_pct)),t("women"),"promedio de los eventos"));
  // participants per event over time, coloured by series
  const cats=E.map((e,i)=>({label:dateStr(e.date).replace(/ \d{4}$/,""),sub:"",tipTitle:`${evTitle(e)} · ${seriesName(e.series)}`}));
  const perSeries=SL.map(sv=>({label:sv.name,color:seriesColor(sv.id),values:E.map(e=>e.series===sv.id?e.participants_total:0)}));
  const c1=card("Participantes por evento","Cada barra es un evento; el color indica la serie",
    legend(SL.map(sv=>[seriesColor(sv.id),sv.name.length>48?sv.name.slice(0,47)+"…":sv.name])),vbars(cats,perSeries,{stacked:true}));
  // events by type (ring: share of events)
  const types={};E.forEach(e=>{types[e.type||"Otro"]=(types[e.type||"Otro"]||0)+1});
  const tk=Object.keys(types).sort((a,b)=>types[b]-types[a]);
  const c2=card("Eventos por tipo",null,ring(tk.map((k2,i)=>({label:k2,n:types[k2],count:types[k2],pct:100*types[k2]/E.length,color:typeColor(k2)})),{center:fmt(E.length),sub:"eventos"}));
  // table by series
  const rows=SL.map(sv=>{const es=evOf(sv.id),m=(DATA.series_metrics||{})[sv.id]||{};const cv=es.filter(e=>e.conversion_pct!=null);
    return {sv,es,m,parts:es.reduce((a,e)=>a+e.participants_total,0),conv:avg(cv,e=>e.conversion_pct)}});
  const scol=[["Serie",r=>{const sp=h("span",{});sp.append(h("i",{style:`display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;background:${seriesColor(r.sv.id)}`}),r.sv.name);return sp}],
    ["Eventos",r=>fmt(r.es.length)],["Participantes",r=>fmt(r.parts)],["Promedio por evento",r=>fmt(r.es.length?r.parts/r.es.length:null)],
    [t("conv"),r=>pct(r.conv)],["Personas únicas",r=>fmt(r.m.unique_attendees)],["Asistieron a 2+",r=>fmt(r.m.attended_2plus)],
    ["Último evento",r=>dateStr(r.es.length?r.es[r.es.length-1].date:null)]];
  const ecol=[[t("date"),e=>dateStr(e.date)],[t("session"),e=>evLink(e)],["Serie",e=>seriesName(e.series)],["Tipo",e=>e.type||""],
    [t("participants"),e=>fmt(e.participants_total)],[t("conv"),e=>pct(e.conversion_pct)],["Recurrentes (cualquier evento)",e=>pct((e.gm||{}).returning_pct)]];
  return [head,k,h("div",{class:"grid"},c1,c2),h("div",{style:"height:16px"}),
    card("Resumen por serie",null,table(scol,rows,[0])),h("div",{style:"height:16px"}),
    card("Todos los eventos",null,table(ecol,[...E].reverse(),[1,2,3]))];
}

function eventView(e){
  const SE=evOf(e.series), d=e.demographics, idx=SE.indexOf(e), P=idx>0?SE[idx-1]:null, pd=P?P.demographics:{};
  const head=h("div",{class:"ev-head"},h("h2",{text:evTitle(e)}),h("div",{class:"meta",text:[e.speaker,e.speaker_affiliation,dateStr(e.date)].filter(Boolean).join(" · ")}),
    h("div",{class:"meta",style:"font-size:13px",text:`${seriesName(e.series)} · ${e.type||""} · evento ${idx+1} de ${SE.length}`}));
  const notes=[];const dn=e.data_notes||{};
  if(dn.us_default_discarded)notes.push(t("usNote")(dn.us_default_discarded));
  if(dn.country_inferred_from_email)notes.push(t("inferredNote")(dn.country_inferred_from_email));
  const ser=e.sm||{}, gm=e.gm||{};
  const g=(title,...tiles)=>[h("div",{class:"kgroup",text:title}),h("div",{class:"kpis"},...tiles)];
  const kp=[
    ...g("Alcance",
      kpi(fmt(e.participants_total),t("participants"),t("participantsN"),P&&delta(e.participants_total,P.participants_total)),
      kpi(fmt(e.registrations),t("registered"),null,P&&delta(e.registrations,P.registrations)),
      kpi(pct(e.conversion_pct),t("conv"),t("convN"),P&&delta(e.conversion_pct,P.conversion_pct,"pp")),
      kpi(fmt(d.countries_n),t("countries"),null,P&&delta(d.countries_n,pd.countries_n)),
      kpi(pct(d.lac_pct),t("lac"),null,P&&delta(d.lac_pct,pd.lac_pct,"pp"))),
    ...g("Participación",
      kpi(fmt(e.peak_concurrent),t("peak"),null,P&&delta(e.peak_concurrent,P.peak_concurrent)),
      kpi(fmt(e.minutes_median)+" "+t("min"),t("median"),e.duration_min?`${t("of")} ${e.duration_min} ${t("min")}`:null),
      kpi(pct(e.stayed_half_pct),t("stayed"),null,P&&delta(e.stayed_half_pct,P.stayed_half_pct,"pp")),
      kpi(fmt(e.chat.questions),t("questions"),null,P&&delta(e.chat.questions,P.chat.questions)),
      kpi(fmt(e.chat.people),"Personas que escribieron en el chat"),
      kpi(pct(e.late_pct),"Llegaron tarde","más de 10 min después del inicio programado",P&&delta(e.late_pct,P.late_pct,"pp"))),
    ...g("Perfil del público",
      kpi(pct(d.women_pct),t("women"),null,P&&delta(d.women_pct,pd.women_pct,"pp")),
      kpi(pct(ser.returning_pct),"Recurrente en la serie",idx>0?"asistió a un evento anterior de esta serie":"primer evento de la serie"),
      kpi(pct(gm.returning_pct),"Recurrente en general","asistió antes a cualquier otro evento"),
      d.sectors[0]?kpi(pct(d.sectors[0].pct),secName(d.sectors[0].key),"sector principal"):null,
      d.countries[0]?kpi(pct(d.countries[0].pct),cname(d.countries[0].key),"país con más participantes"):null),
  ];
  // key facts in plain Spanish
  const facts=[];
  facts.push(`Participaron ${fmt(e.participants_total)} personas de ${fmt(d.countries_n)} países` + (e.registrations?`, sobre ${fmt(e.registrations)} inscripciones (tasa de asistencia de ${pct(e.conversion_pct)}${P&&P.conversion_pct!=null?`; ${pct(P.conversion_pct)} en la sesión anterior`:""}).`:"."));
  const top3=d.countries.slice(0,3);if(top3.length)facts.push(`${top3.map(c=>cname(c.key)).join(", ").replace(/, ([^,]*)$/," y $1")} concentraron el ${pct(top3.reduce((a,c)=>a+c.pct,0))} de los participantes con país conocido; el ${pct(d.lac_pct)} provino de América Latina y el Caribe.`);
  if(e.peak_concurrent)facts.push(`El máximo de personas conectadas a la vez fue ${fmt(e.peak_concurrent)}; la mitad del público estuvo conectada al menos ${fmt(e.minutes_median)} minutos y el ${pct(e.stayed_half_pct)} se quedó más de la mitad de la sesión.`);
  if(d.women_pct!=null&&d.sectors.length>1)facts.push(`Las mujeres representaron el ${pct(d.women_pct)} de la participación. Por sector destacaron ${(DATA.sectors[d.sectors[0].key]||{}).es_def} (${pct(d.sectors[0].pct)}) y ${(DATA.sectors[d.sectors[1].key]||{}).es_def} (${pct(d.sectors[1].pct)}).`);
  if(idx>0&&ser.returning!=null)facts.push(`${fmt(ser.returning)} personas del público (${pct(ser.returning_pct)}) ya habían asistido a un evento anterior de esta serie.`);
  if(gm.returning&&gm.returning!==ser.returning)facts.push(`Contando todos los eventos, ${fmt(gm.returning)} personas (${pct(gm.returning_pct)}) ya habían participado antes en alguna actividad.`);
  if(e.registration_curve&&e.registration_curve.last_week_pct!=null)facts.push(`El ${pct(e.registration_curve.last_week_pct)} de las inscripciones llegó en la última semana y el ${pct(e.registration_curve.same_day_pct)} el mismo día del evento.`);
  if(e.chat.messages)facts.push(`En el chat se publicaron ${fmt(e.chat.messages)} mensajes de ${fmt(e.chat.people)} personas, con ${fmt(e.chat.questions)} preguntas.`);
  const factsBox=h("section",{class:"facts"},h("h2",{text:"Datos clave"}),h("ul",{},...facts.map(f=>h("li",{text:f}))));
  const top=d.countries.slice(0,10),rest=d.countries.slice(10);
  const crow=top.map(c=>({label:cname(c.key),n:c.pct,tip:[cname(c.key),`${fmt(c.n)} ${t("people")} · ${fmt(c.pct,1)}%`]}));
  if(rest.length){const n=rest.reduce((a,c)=>a+c.n,0),p=rest.reduce((a,c)=>a+c.pct,0);crow.push({label:`${t("others")} (${rest.length})`,n:p,tip:[`${t("others")}: ${rest.map(c=>cname(c.key)).join(", ")}`,`${fmt(n)} ${t("people")} · ${fmt(p,1)}%`]})}
  const pf=v=>fmt(v,0)+"%";
  const full=x=>{if(x)x.style.gridColumn="1/-1";return x};
  const charts=[
    full(card(t("over"),"Público (sin organización ni panel), cada 2 minutos; las barras naranjas muestran los mensajes del chat",
      e.timeline.length?timelineChart(e.timeline,e.chat_timeline):h("p",{class:"empty",text:"–"}))),
  ];
  if(e.minutes_hist&&e.minutes_hist.length)charts.push(card("¿Cuánto tiempo se quedaron?",`Mediana: ${fmt(e.minutes_median)} min de ${fmt(e.duration_min)} min`,
    vbars(e.minutes_hist.map(b=>({label:b.key.replace(" min",""),sub:"min",note:pct(b.pct),tipTitle:b.key})),[{label:t("people"),color:"var(--s1)",values:e.minutes_hist.map(b=>b.n)}])));
  if(e.registration_curve&&e.registration_curve.points)charts.push(card("¿Cuándo se inscribieron?",
    `${pct(e.registration_curve.last_week_pct)} en la última semana · ${pct(e.registration_curve.same_day_pct)} el mismo día`,cumLine(e.registration_curve)));
  charts.push(card(t("byCountry"),t("byCountryH"),hbars(crow,{valueFmt:pf})));
  if(e.country_funnel&&e.country_funnel.length){
    charts.push(card(t("funnel"),"Los 12 países con más inscripciones; a la derecha, qué parte de los inscritos se conectó",legend([["var(--s1)",t("registered")],["var(--s2)",t("attended")]]),
      hbars(e.country_funnel.slice(0,12).map(c=>({label:cname(c.key),reg:c.reg,att:c.att,tip:[cname(c.key),`${t("registered")}: ${fmt(c.reg)}`,`${t("attended")}: ${fmt(c.att)} (${pct(100*c.att/c.reg)})`]})),
        {series:[{key:"reg",color:"var(--s1)",label:t("registered")},{key:"att",color:"var(--s2)",label:t("attended")}],
         valueFmt:(v,r,sr)=>sr.key==="att"?`${fmt(v)} · ${pct(100*v/(r.reg||1))}`:fmt(v)})));
  }
  charts.push(card(t("bySector"),t("bySectorH"),ring(d.sectors.map(x=>({label:secName(x.key),n:x.n,count:x.n,pct:x.pct,color:SECTOR_COLOR[x.key]||"var(--muted)"})),
      {center:fmt(d.sectors.reduce((a,x)=>a+x.n,0)),sub:"personas"})));
  charts.push(card(t("byGender"),null,ring(["F","M","O"].map(k=>d.gender.find(x=>x.key===k)).filter(Boolean).map(x=>({label:t(x.key),n:x.n,count:x.n,pct:x.pct,color:GENDER_COLOR[x.key]})),
      {center:pct(d.women_pct),sub:"mujeres"})));
  if(e.connection&&e.connection.length){const CC=["var(--s1)","var(--s2)","var(--s3)","var(--s4)"];
    charts.push(card("¿Cómo se conectaron?","Público, según el dispositivo informado por Webex",ring(e.connection.slice(0,4).map((x,i)=>({label:x.key.replace(" aplicación",""),n:x.n,count:x.n,pct:x.pct,color:CC[i]})),
      {center:fmt(e.connection.reduce((a,x)=>a+x.n,0)),sub:"personas"})))}
  const txt=e.summary.es||e.summary.en;
  const art=h("div",{class:"article"});
  if(txt){art.innerHTML=md(txt)}else art.append(h("p",{class:"empty",text:t("noSummary")}));
  const btns=h("div",{class:"btns"},...Object.entries(e.docx||{}).map(([l,f])=>h("a",{class:"btn",href:f,download:""},`${t("download")} (${l==="es"?"español":"inglés"})`)));
  const rev=e.review?h("details",{},h("summary",{text:t("review")}),h("div",{class:"review",text:e.review})):null;
  charts.push(h("section",{class:"card article-card",style:"grid-column:1/-1"},h("h2",{text:t("summary")}),btns,art,rev));
  return [head,factsBox,...kp,...notes.map(n=>h("div",{class:"note",text:n})),h("div",{class:"grid"},...charts)];
}

function render(){
  if(EMBED){document.body.classList.add("embed");document.documentElement.setAttribute("data-theme","light");}
  document.documentElement.lang=lang;
  const C=DATA.config||{};
  $("#title").textContent=C.title_es||"Eventos";
  $("#subtitle").textContent="";
  if(tab==="series")tab="global";
  const tabs=$("#tabs");tabs.replaceChildren();
  const ids=["global",...DATA.series_list.map(x=>"series:"+x.id)];
  const ev=DATA.events.find(x=>x.id===tab);
  if(!ids.includes(tab)&&!ev)tab="global";
  ids.forEach(id=>{const b=h("button",{role:"tab","aria-selected":id===tab||(ev&&id==="series:"+ev.series)},
      id==="global"?"Todos los eventos":seriesName(id.slice(7)).slice(0,40));
    b.onclick=()=>{tab=id;history.replaceState(null,"","#"+id);render();scrollTo(0,0)};tabs.append(b)});
  const m=$("#main");
  m.replaceChildren(...(tab==="global"?globalView():tab.startsWith("series:")?seriesView(tab.slice(7)):eventView(ev)));
}
$("#print").onclick=()=>print();
addEventListener("hashchange",()=>{tab=decodeURIComponent(location.hash.slice(1))||"global";render()});
render();
</script>
</body>
</html>
