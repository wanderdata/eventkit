# Sector classification rules.
# Order of precedence (first match wins):
#   1. config/org_sectors.csv  (manual / cached decisions, exact organization text)
#   2. email domain rules below
#   3. keyword rules on the organization text (checked in the order of `order`)
#   4. keyword rules on the job title
#   5. (optional) Claude classifies what is left; results are cached in org_sectors.csv
#   6. otherwise "sin_clasificar"
# Keywords are matched on lowercase, accent-free text as whole words / phrases.

labels:
  publico:        {es: "Sector público", en: "Public sector", es_def: "el sector público", en_def: "the public sector"}
  academia:       {es: "Universidades e instituciones de investigación", en: "Universities and research institutions", es_def: "las universidades e instituciones de investigación", en_def: "universities and research institutions"}
  privado:        {es: "Sector privado", en: "Private sector", es_def: "el sector privado", en_def: "the private sector"}
  internacional:  {es: "Organizaciones internacionales", en: "International organizations", es_def: "las organizaciones internacionales", en_def: "international organizations"}
  sociedad_civil: {es: "Sociedad civil y ONG", en: "Civil society and NGOs", es_def: "las organizaciones de la sociedad civil", en_def: "civil society organizations"}
  otros:          {es: "Independientes y otros", en: "Independent and other", es_def: "profesionales independientes y otros", en_def: "independent professionals and others"}
  sin_clasificar: {es: "Sin clasificar", en: "Unclassified"}

order: [internacional, academia, publico, sociedad_civil, otros, privado]

email_domains:
  internacional: [cepal.org, eclac.org, un.org, undp.org, unesco.org, unicef.org, fao.org, ilo.org, iadb.org, worldbank.org, caf.com, oecd.org, oas.org, iica.int, unido.org, giz.de, merit.unu.edu, unu.edu, sela.org, aladi.org, sica.int, wto.org, imf.org, wipo.int]
  academia_suffix: [.edu, .edu.ar, .edu.bo, .edu.br, .edu.co, .edu.ec, .edu.mx, .edu.pe, .edu.py, .edu.sv, .edu.uy, .edu.ve, .edu.gt, .edu.hn, .edu.ni, .edu.pa, .edu.do, .edu.cu, .ac.uk, .ac.cr, .uchile.cl, .uc.cl, .udec.cl, .ubiobio.cl, .usach.cl, .unam.mx, .itesm.mx, .tec.mx, .ox.ac.uk, .unal.edu.co, .uba.ar, .unlp.edu.ar, .ucr.ac.cr, .pucp.pe, .unmsm.edu.pe, .unsa.edu.pe]
  publico_suffix: [.gob, .gov, .gob.ar, .gob.bo, .gob.cl, .gob.do, .gob.ec, .gob.gt, .gob.hn, .gob.mx, .gob.ni, .gob.pa, .gob.pe, .gob.sv, .gob.ve, .gov.br, .gov.co, .gov.py, .gub.uy, .go.cr, .gov.uk, .gc.ca, .mil, .corfo.cl, .sence.cl]

