[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventkit"
version = "0.1.0"
description = "Webinar summaries (ES/EN) and participation dashboards from Webex exports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyyaml>=6",
  "unidecode>=1.3",
  "rapidfuzz>=3",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "pypdf>=4",
  "anthropic>=0.40",
]

[project.optional-dependencies]
test = ["pytest>=8"]
app = ["streamlit>=1.50"]

[project.scripts]
eventkit = "eventkit.cli:main"

[tool.setuptools]
packages = ["eventkit"]

[tool.setuptools.package-data]
eventkit = ["defaults/*", "templates/*"]
